[package]
name = "fay"
version = "0.1.0"
description = "Fay — a minimal dark desktop launcher hub."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Live stats in the Heart (CPU / RAM / network); GPU comes from nvidia-smi.
sysinfo = "0.33"
# Firefox-family bookmark backups (Zen, Firefox, LibreWolf…) are mozlz4 files.
lz4_flex = "0.11"

# Windows-only native bits: the low-level mouse hook (Ctrl+Mouse5 summon),
# SendInput (media keys, snippet paste) and the clipboard.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
] }
