name: Release

# Tag a version (e.g. `git tag v0.1.0 && git push origin v0.1.0`) and this builds
# the Windows installer and publishes it on the GitHub Releases page — a clean
# download link instead of digging through Actions artifacts.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install Tauri CLI
        run: npm install
      - name: Build installer (NSIS)
        run: npx tauri build --bundles nsis
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Fay ${{ github.ref_name }}
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*.exe
