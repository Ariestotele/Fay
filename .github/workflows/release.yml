name: Release

# Publishes a GitHub Release automatically when `main` carries a version that
# hasn't been released yet. To ship: bump `version` in package.json (and
# src-tauri/tauri.conf.json + Cargo.toml), merge to main — the installer lands on
# the Releases page as v<version>. Tags are created by the workflow itself.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      exists: ${{ steps.ver.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "v$v already released"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "v$v not released yet"
          fi

  release:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install Tauri CLI
        run: npm install
      - name: Build installer (NSIS)
        run: npx tauri build --bundles nsis
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Fay v${{ needs.check.outputs.version }}
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*.exe
